services:
  web:
    image: ${WEB_IMAGE_REPO:?Set WEB_IMAGE_REPO}:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      API_PROXY_TARGET: http://13.211.77.56:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devfolio
      - aha-network

networks:
  devfolio:
    driver: bridge
  aha-network:
    external: true
    name: aha-network
