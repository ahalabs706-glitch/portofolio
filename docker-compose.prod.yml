services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - devfolio

  api:
    image: ${API_IMAGE_REPO:?Set API_IMAGE_REPO}:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      # Proxy hops in front of the API: nginx-lab -> web nginx -> api
      TRUST_PROXY: 2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      devfolio:
        aliases:
          - devfolio-api
      aha-network:
        aliases:
          - devfolio-api

  web:
    image: ${WEB_IMAGE_REPO:?Set WEB_IMAGE_REPO}:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      API_PROXY_TARGET: http://devfolio-api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devfolio
      - aha-network

volumes:
  postgres_data:

networks:
  devfolio:
    driver: bridge
  aha-network:
    external: true
    name: aha-network
